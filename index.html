<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Box Online</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Third-Party Libraries & SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

    <!-- Authentication & Room Portal Container -->
    <div id="login-screen" class="screen-container">
        <div class="login-box-split">
            
            <!-- User Profile & Avatar Customization Section -->
            <div class="login-col left-col">
                <h3>👤 Cấu hình cá nhân</h3>
                
                <div class="input-group">
                    <label for="user-name">Tên hiển thị:</label>
                    <input type="text" id="user-name" placeholder="Nhập tên của bạn..." required>
                </div>

                <div class="avatar-selection-wrapper">
                    <label>Chọn Avatar:</label>
                    <div class="avatar-grid" id="avatar-grid">
                        <div class="avatar-item selected" onclick="selectAvatar(this)">🐱</div>
                        <div class="avatar-item" onclick="selectAvatar(this)">🐶</div>
                        <div class="avatar-item" onclick="selectAvatar(this)">🦊</div>
                        <div class="avatar-item" onclick="selectAvatar(this)">🐰</div>
                        <div class="avatar-item" onclick="selectAvatar(this)">🐼</div>
                        <div class="avatar-item" onclick="selectAvatar(this)">🐻</div>
                        <div class="avatar-item" onclick="selectAvatar(this)">🐯</div>
                        <div class="avatar-item" onclick="selectAvatar(this)">🐨</div>
                        <div class="avatar-item" onclick="selectAvatar(this)">🦄</div>
                        <div class="avatar-item" onclick="selectAvatar(this)">🐥</div>
                    </div>
                </div>
            </div>

            <!-- Room Access Control Section -->
            <div class="login-col right-col">
                <h3>🎙️ Tham gia Music Box</h3>

                <div class="input-group">
                    <label for="room-id">Mã phòng (Room ID):</label>
                    <input type="text" id="room-id" placeholder="Nhập ID phòng..." required>
                </div>

                <div class="input-group">
                    <label for="room-pass">Mật khẩu phòng:</label>
                    <input type="password" id="room-pass" placeholder="Nhập mật khẩu..." required>
                </div>

                <div class="button-group">
                    <button id="btn-join" class="btn btn-primary" onclick="joinRoom()">Vào Phòng</button>
                    <button id="btn-create-room" class="btn btn-success" style="display: none;" onclick="createRoom()">Tạo Phòng Mới (Admin)</button>
                </div>

                <div class="admin-link">
                    <a href="#" onclick="openAdminModal()">Kích hoạt quyền Admin</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Administrative Authentication Modal -->
    <div id="admin-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeAdminModal()">&times;</span>
            <h3>🔐 Nhập Admin Code</h3>
            <form onsubmit="handleAdminSubmit(event)">
                <input type="password" id="admin-code-input" placeholder="Nhập mã Admin..." required>
                <button type="submit" class="btn btn-primary">Xác nhận</button>
            </form>
        </div>
    </div>

    <!-- Main Active Room View -->
    <div id="room-screen" class="screen-container" style="display: none;">
        <!-- Header Controls & Room Metadata -->
        <div class="top-bar">
            <h2>Phòng: <span id="display-room-id">---</span></h2>
            <button class="btn btn-danger" onclick="leaveRoom()">Rời Phòng</button>
        </div>

        <!-- Music Box Subsystem -->
        <div id="music-box-container" class="music-box">
            
            <!-- Song Search & Queue Interface -->
            <div id="selection-screen" class="mb-screen active">
                <div class="mb-header">
                    <h3>🎵 Tìm Bài Hát Karaoke (YouTube)</h3>
                    <div class="search-box">
                        <input type="text" id="song-search" placeholder="Gõ tên bài hát..." onkeypress="if(event.key === 'Enter') searchYouTube()">
                        <button class="btn btn-primary" onclick="searchYouTube()">Tìm</button>
                    </div>
                </div>

                <!-- YouTube Query Results Grid -->
                <div class="song-list" id="search-results">
                    <p class="placeholder-text">Nhập tên bài hát và nhấn Tìm để chọn bản Karaoke...</p>
                </div>

                <!-- Playlist Queue Status -->
                <div class="queue-section">
                    <h4>📋 Hàng chờ bài hát (<span id="queue-count">0</span>)</h4>
                    <div id="queue-list" class="queue-list"></div>
                </div>
            </div>

            <!-- Video Player Output Interface -->
            <div id="lyric-screen" class="mb-screen">
                <div class="lyric-header">
                    <span id="playing-song-info" class="playing-info">Đang phát: Chưa có bài hát</span>
                    <button class="btn-change-song" onclick="skipSong()">⏭️ Bài tiếp theo</button>
                </div>
                <div class="video-display-area">
                    <div id="youtube-player"></div>
                </div>
            </div>
        </div>

        <!-- Peer WebRTC Video Grid Area -->
        <div class="participants-grid" id="participants-container">
            <div class="user-card" id="local-user-card">
                <video id="local-video" autoplay playsinline muted></video>
                <div id="local-avatar" class="user-avatar" style="display: none;">🐱</div>
                <div class="status-badge">
                    <span id="local-mic-badge" class="badge-icon">🎙️</span>
                    <span id="local-cam-badge" class="badge-icon">📹</span>
                </div>
                <span class="user-name" id="local-name-tag">Bạn</span>
            </div>
        </div>

        <!-- Media Devices Control Toolbar -->
        <div class="controls-bar">
            <button id="mic-btn" class="btn btn-control" onclick="toggleMic()">
                🎙️ <span id="mic-label">Tắt Mic</span>
            </button>
            <button id="cam-btn" class="btn btn-control" onclick="toggleCam()">
                📹 <span id="cam-label">Tắt Cam</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
